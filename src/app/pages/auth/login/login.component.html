<div class="sso-gateway-container">
  <div class="gateway-header">
    <div class="gateway-logo-badge">
      <span nz-icon nzType="api" nzTheme="outline"></span>
    </div>
    <h1 class="gateway-title">Integration Hub Enterprise</h1>
    <p class="gateway-subtitle">Cổng Quản Trị Tích Hợp & Điều Phối Sự Kiện Đối Tác Toàn Hệ Thống</p>
  </div>

  <div class="gateway-actions">
    <button
      nz-button
      nzType="primary"
      nzBlock
      nzSize="large"
      [nzLoading]="redirecting"
      (click)="redirectToSso()"
      class="sso-login-btn"
    >
      @if (!redirecting) {
        <span nz-icon nzType="login" nzTheme="outline"></span>
      }
      <span>Chuyển đến Cổng Đăng Nhập SSO</span>
    </button>
  </div>

  <div class="gateway-footer">
    <span nz-icon nzType="safety-certificate" nzTheme="outline"></span>
    <span>Xác thực mã hóa an toàn chuẩn OAuth2 OpenID Connect & JWT RS256</span>
  </div>
</div>

<div class="login-welcome">
  <h1 class="login-title">Đổi mật khẩu tài khoản</h1>
  <p class="login-subtitle">Vui lòng nhập mật khẩu hiện tại và mật khẩu mới để bảo mật tài khoản.</p>
</div>

<form (ngSubmit)="onSubmit()" class="login-form" #changePasswordForm="ngForm">
  @if (error) {
    <div class="login-alert">
      <span nz-icon nzType="warning" nzTheme="fill"></span>
      <span>{{ error }}</span>
    </div>
  }

  <div class="login-field">
    <label class="login-label" for="oldPassword">Mật khẩu hiện tại</label>
    <input
      nz-input
      id="oldPassword"
      type="password"
      [(ngModel)]="oldPassword"
      name="oldPassword"
      placeholder="Nhập mật khẩu hiện tại"
      required
      class="login-input-wrap"
    />
  </div>

  <div class="login-field">
    <label class="login-label" for="newPassword">Mật khẩu mới</label>
    <input
      nz-input
      id="newPassword"
      type="password"
      [(ngModel)]="newPassword"
      name="newPassword"
      placeholder="Tối thiểu 6 ký tự"
      required
      class="login-input-wrap"
    />
  </div>

  <div class="login-field">
    <label class="login-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
    <input
      nz-input
      id="confirmPassword"
      type="password"
      [(ngModel)]="confirmPassword"
      name="confirmPassword"
      placeholder="Nhập lại mật khẩu mới"
      required
      class="login-input-wrap"
    />
  </div>

  <button nz-button nzType="primary" nzBlock [nzLoading]="loading" class="login-btn">
    @if (!loading) {
      <span nz-icon nzType="save" nzTheme="outline"></span>
    }
    <span>Cập nhật mật khẩu</span>
  </button>

  <div class="login-footer-text">
    <a (click)="goBack()" class="create-account-link">Bỏ qua và về trang chủ</a>
  </div>
</form>

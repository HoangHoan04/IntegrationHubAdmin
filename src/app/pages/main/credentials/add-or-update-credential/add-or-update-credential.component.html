<form nz-form [formGroup]="form" nzLayout="vertical">
  <div class="grid-2-col">
    <nz-form-item>
      <nz-form-label nzRequired>Tên Cấu Hình</nz-form-label>
      <nz-form-control nzErrorTip="Vui lòng nhập tên credential">
        <input nz-input formControlName="name" placeholder="VD: ZaloOA - Công ty ABC" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzRequired>Provider Adapter</nz-form-label>
      <nz-form-control nzErrorTip="Chọn provider">
        <nz-select formControlName="providerCode" nzPlaceHolder="Chọn Provider" (ngModelChange)="onProviderChange($event)">
          <nz-option *ngFor="let a of adapters" [nzValue]="a.providerCode" [nzLabel]="a.displayName + ' (' + a.providerCode + ')'"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzRequired>Môi trường</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="environment">
          <nz-option *ngFor="let e of environments" [nzValue]="e" [nzLabel]="e"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label>Tên Công Ty / Scope</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="companyName" placeholder="Tùy chọn - để áp dụng theo công ty" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <nz-divider nzText="Khóa Xác Thực" nzOrientation="left"></nz-divider>

  <div *ngIf="currentFields.length === 0" class="empty-fields">
    <nz-empty nzNotFoundContent="Vui lòng chọn Provider để hiển thị các trường khóa xác thực"></nz-empty>
  </div>

  <div formGroupName="fields" class="grid-2-col">
    <nz-form-item *ngFor="let field of currentFields">
      <nz-form-label [nzRequired]="field.isRequired">{{ field.label }}</nz-form-label>
      <nz-form-control [nzErrorTip]="field.label + ' là bắt buộc'">
        <input
          nz-input
          [type]="field.isSecret ? 'password' : (field.type === 'number' ? 'number' : 'text')"
          [formControlName]="field.key"
          [placeholder]="field.placeholder || ('Nhập ' + field.label)"
        />
      </nz-form-control>
    </nz-form-item>
  </div>

  <nz-divider></nz-divider>

  <nz-form-item>
    <nz-form-control>
      <label nz-checkbox formControlName="isActive">Kích hoạt credential này</label>
    </nz-form-control>
  </nz-form-item>

  <div class="modal-footer">
    <button nz-button (click)="cancel()">Hủy</button>
    <button nz-button nzType="primary" [nzLoading]="loading" (click)="submit()">
      {{ isEdit ? 'Cập nhật' : 'Tạo mới' }}
    </button>
  </div>
</form>

<style>
.grid-2-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 12px; }
.empty-fields { padding: 20px 0; }
</style>

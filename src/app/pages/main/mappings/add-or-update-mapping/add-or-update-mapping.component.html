<form nz-form [formGroup]="form" (ngSubmit)="onSubmit()" nzLayout="vertical">
  <nz-form-item>
    <nz-form-label nzRequired>Tên cấu hình Mapping</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng nhập tên mapping">
      <input nz-input formControlName="name" placeholder="Ví dụ: Gửi tin ZNS chào mừng nhân sự mới" />
    </nz-form-control>
  </nz-form-item>

  <div class="grid-2-col">
    <nz-form-item>
      <nz-form-label nzRequired>Hệ thống nguồn</nz-form-label>
      <nz-form-control nzErrorTip="Chọn hệ thống nguồn">
        <nz-select formControlName="sourceSystem">
          <nz-option *ngFor="let s of sourceSystems" [nzValue]="s" [nzLabel]="s"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzRequired>Provider bên thứ 3</nz-form-label>
      <nz-form-control nzErrorTip="Chọn provider">
        <nz-select formControlName="providerCode" nzPlaceHolder="Chọn Provider">
          <nz-option *ngFor="let a of adapters" [nzValue]="a.providerCode" [nzLabel]="a.displayName + ' (' + a.providerCode + ')'"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>
  </div>

  <nz-form-item>
    <nz-form-label nzRequired>Sự kiện (EventType)</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng nhập EventType">
      <input nz-input formControlName="eventType" placeholder="Ví dụ: hrm.employee.created hoặc wms.order.paid" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label>Mô tả chi tiết</nz-form-label>
    <nz-form-control>
      <input nz-input formControlName="description" placeholder="Mô tả mục đích của mapping..." />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label>Cấu hình bổ sung (Config JSON)</nz-form-label>
    <nz-form-control>
      <textarea nz-input formControlName="configJson" rows="5" placeholder='{"templateId": "...", "paramMap": {...}}' style="font-family: monospace;"></textarea>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-control>
      <label nz-checkbox formControlName="isActive">Kích hoạt mapping này ngay sau khi lưu</label>
    </nz-form-control>
  </nz-form-item>

  <div class="modal-footer">
    <button nz-button nzType="default" type="button" (click)="onCancel()">Hủy bỏ</button>
    <button nz-button nzType="primary" type="submit" [nzLoading]="loading">
      {{ isEdit ? 'Lưu thay đổi' : 'Tạo mới' }}
    </button>
  </div>
</form>
